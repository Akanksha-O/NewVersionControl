<!DOCTYPE html>
<html>
<head>
    <title>To-Do Form</title>
</head>
<body>
    <h2>Submit a To-Do Item</h2>

    <form action="/submittodoitem" method="POST">
        <label>item_id:</label><br>
        <input type="number" name="item_id"><br><br>

        <label>Item UUID:</label>
        <input type="text" name="itemUuid" required><br><br>

        <label>Item Hash:</label>
        <input type="text" name="itemHash" required><br><br>



        <label>Item Name:</label><br>
        <input type="text" name="itemName"><br><br>

        <label>Item Description:</label><br>
        <textarea name="itemDescription"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
